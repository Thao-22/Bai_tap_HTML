<!DOCTYPE html>
<html>
<head>
    <title>Tạo form và các điều khiển</title>
    <script>
        function ThongBao() {
            document.getElementById("lblThongBao").innerText = "Bạn đã đăng ký thành công!!!";
        }
    </script>
</head>
<body>
    <form id="formKhuyenMai">
        <table border="1" align="center" cellpadding="5" cellspacing="0">
            <tr>
                <td colspan="2" align="center"><b>Phiếu đăng ký tham gia chương trình khuyến mãi</b></td>
            </tr>
            <tr>
                <td>Họ và tên</td>
                <td><input type="text" id="txtHoTen" size="30" value="Nguyễn Ngọc Quỳnh Nga"></td>
            </tr>
            <tr>
                <td>Địa chỉ</td>
                <td><input type="text" id="txtDiaChi" size="30" value="2Bia Hùng Vương, Q10"></td>
            </tr>
            <tr>
                <td>Điện thoại</td>
                <td><input type="text" id="txtDienThoai" size="20" value="0909097506"></td>
            </tr>
            <tr>
                <td>Phái</td>
                <td>
                    <input type="radio" name="gioitinh" value="Nam"> Nam
                    <input type="radio" name="gioitinh" value="Nu" checked> Nữ
                </td>
            </tr>
            <tr>
                <td>Nghề nghiệp</td>
                <td>
                    <select id="cboNgheNghiep">
                        <option value="Bác sĩ">Bác sĩ</option>
                        <option value="Kỹ sư">Kỹ sư</option>
                        <option value="Giáo viên" selected>Giáo viên</option>
                        <option value="Khác">Khác</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Chọn sản phẩm tham gia</td>
                <td>
                    <select id="lstSanPham" size="4" multiple>
                        <option value="Kem đánh răng">Kem đánh răng</option>
                        <option value="Bột giặt" selected>Bột giặt</option>
                        <option value="Dầu gội đầu" selected>Dầu gội đầu</option>
                        <option value="Sữa tắm">Sữa tắm</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Số người dự đoán tham gia</td>
                <td><input type="text" id="txtDuDoan" size="10" value="250000"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="button" value="Đồng ý" onclick="ThongBao()">
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <div id="lblThongBao"></div>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
